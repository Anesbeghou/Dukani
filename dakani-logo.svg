<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="cutouts">
      <rect x="140" y="214" width="232" height="176" rx="14" fill="#ffffff"/>
      <rect x="170" y="246" width="54" height="54" rx="8" fill="#000000"/>
      <rect x="288" y="246" width="54" height="54" rx="8" fill="#000000"/>
      <rect x="221" y="289" width="70" height="101" rx="8" fill="#000000"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#sheen)"/>

  <!-- Awning (scalloped) -->
  <path d="M150,148 L362,148 L390,214 L356.5,229 L323,214 L289.5,229 L256,214 L222.5,229 L189,214 L155.5,229 L122,214 Z"
        fill="#ffffff"/>
  <line x1="203.5" y1="148" x2="196" y2="214" stroke="#0a3d3a" stroke-opacity="0.16" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="148" x2="256" y2="214" stroke="#0a3d3a" stroke-opacity="0.16" stroke-width="5" stroke-linecap="round"/>
  <line x1="308.5" y1="148" x2="316" y2="214" stroke="#0a3d3a" stroke-opacity="0.16" stroke-width="5" stroke-linecap="round"/>

  <!-- Shop front with door + window cutouts revealing background gradient -->
  <rect x="140" y="214" width="232" height="176" rx="14" fill="#ffffff" mask="url(#cutouts)"/>
</svg>
